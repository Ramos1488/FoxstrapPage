<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foxstrap | Wiki</title>
    
    <link rel="icon" type="image/png" href="https://github.com/Ramos1488/Foxstrap/blob/main/Assets/foxstrap.png?raw=true">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #a855f7;
            --bg: #050508;
            --glass: rgba(15, 15, 25, 0.7);
            --border: rgba(168, 85, 247, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            background-image: radial-gradient(circle at 50% -20%, #1a1033 0%, transparent 50%);
            overflow-x: hidden;
        }

        #rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .drop { position: absolute; width: 1px; height: 50px; background: var(--primary); opacity: 0.1; will-change: transform; }
        @keyframes fall { from { transform: translateY(-100px); } to { transform: translateY(110vh); } }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 8%; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
        .logo-text { font-family: 'Syncopate', sans-serif; font-size: 1rem; }
        .logo-text span { color: var(--primary); }

        #lang-switch {
            background: transparent; border: 1px solid #333; color: var(--primary);
            padding: 5px 15px; border-radius: 6px; cursor: pointer; font-weight: 900; 
        }

        .wiki-header { padding: 60px 8% 30px; text-align: center; }
        .wiki-header h1 { font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; }

        .wiki-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; padding: 0 8% 100px; max-width: 1400px; margin: 0 auto;
        }

        .wiki-card {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 20px; padding: 30px; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideUp 0.8s both;
        }
        .wiki-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 15px 30px rgba(168, 85, 247, 0.15); }
        .wiki-card i { font-size: 2rem; color: var(--primary); margin-bottom: 15px; display: block; }
        .wiki-card h3 { font-size: 1.5rem; margin-bottom: 10px; }

        /* VIEWER */
        #article-viewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.98); z-index: 1000;
            display: none; padding: 40px 8%; overflow-y: auto; backdrop-filter: blur(25px);
        }
        
        .article-container { max-width: 900px; margin: 40px auto; position: relative; }
        
        .top-nav { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        
        .close-btn {
            background: var(--primary); color: white; border: none;
            padding: 12px 25px; border-radius: 10px; cursor: pointer;
            font-weight: 900; transition: 0.3s; font-size: 0.9rem;
        }
        .close-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--primary); }

        .article-body { min-height: 400px; animation: fadeIn 0.4s ease; }
        .article-body h2 { font-size: 3rem; margin-bottom: 25px; color: var(--primary); }
        .article-body p { font-size: 1.2rem; color: #ccc; margin-bottom: 20px; line-height: 1.8; }
        .article-body pre { 
            background: #000; padding: 25px; border-radius: 15px; border: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace; color: #a855f7; margin: 20px 0;
        }

        /* КНОПКИ НАВИГАЦИИ ВНУТРИ */
        .bottom-nav {
            display: flex; justify-content: space-between; margin-top: 60px;
            padding-top: 30px; border-top: 1px solid var(--border);
        }

        .nav-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            color: white; padding: 15px 35px; border-radius: 12px;
            cursor: pointer; font-weight: 800; font-size: 1rem;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; gap: 12px;
        }

        .nav-btn:hover { border-color: var(--primary); background: rgba(168, 85, 247, 0.1); transform: translateY(-3px); }
        .nav-btn i { color: var(--primary); }
        .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; transform: none; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
    <div id="rain-container"></div>

    <nav>
        <a href="index.html" class="logo-area">
            <span class="logo-text">FOX<span>STRAP</span></span>
        </a>
        <button id="lang-switch">RU</button>
    </nav>

    <header class="wiki-header">
        <h1 id="wiki-title" data-en="DOCUMENTATION" data-ru="ДОКУМЕНТАЦИЯ">DOCUMENTATION</h1>
    </header>

    <main class="wiki-grid">
        <div class="wiki-card" onclick="openArticle(0)">
            <i class="fa-solid fa-play"></i>
            <h3 data-en="Quick Start" data-ru="Быстрый старт">Quick Start</h3>
            <p data-en="Install Foxstrap and launch your first game." data-ru="Установите Foxstrap и запустите первую игру.">Install Foxstrap and launch your first game.</p>
        </div>
        <div class="wiki-card" onclick="openArticle(1)">
            <i class="fa-solid fa-bolt"></i>
            <h3 data-en="FastFlags Guide" data-ru="Гайд по флагам">FastFlags Guide</h3>
            <p data-en="Deep dive into Roblox engine modifications." data-ru="Глубокое погружение в модификации движка.">Deep dive into Roblox engine modifications.</p>
        </div>
        <div class="wiki-card" onclick="openArticle(2)">
            <i class="fa-solid fa-palette"></i>
            <h3 data-en="UI & Themes" data-ru="Интерфейс и Темы">UI & Themes</h3>
            <p data-en="Customize the look and feel of your launcher." data-ru="Настройте внешний вид вашего лаунчера.">Customize the look and feel of your launcher.</p>
        </div>
        <div class="wiki-card" onclick="openArticle(3)">
            <i class="fa-solid fa-share-nodes"></i>
            <h3 data-en="Discord RPC" data-ru="Discord RPC">Discord RPC</h3>
            <p data-en="Show your friends what you're playing." data-ru="Покажите друзьям, во что вы играете.">Show your friends what you're playing.</p>
        </div>
    </main>

    <div id="article-viewer">
        <div class="article-container">
            <div class="top-nav">
                <button class="close-btn" onclick="closeArticle()" data-en="CLOSE" data-ru="ЗАКРЫТЬ">CLOSE</button>
            </div>
            
            <div id="article-body" class="article-body"></div>

            <div class="bottom-nav">
                <button id="prevBtn" class="nav-btn" onclick="navigate(-1)">
                    <i class="fa-solid fa-arrow-left"></i> <span data-en="Back" data-ru="Назад">Back</span>
                </button>
                <button id="nextBtn" class="nav-btn" onclick="navigate(1)">
                    <span data-en="Next" data-ru="Дальше">Next</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'en';
        let currentIndex = 0;

        const content = [
            {
                id: 'start',
                en: { h: "Quick Start", p: "To start using Foxstrap, download the latest beta release. Foxstrap modifies your Roblox client to provide extra features without risking a ban. Just point to your Roblox folder and hit install." },
                ru: { h: "Быстрый старт", p: "Чтобы начать использовать Foxstrap, скачайте последнюю бета-версию. Foxstrap модифицирует ваш клиент Roblox, предоставляя дополнительные функции без риска бана. Просто укажите путь к папке и нажмите установить." }
            },
            {
                id: 'flags',
                en: { h: "FastFlags", p: "FastFlags are internal toggles for the Roblox engine. With Foxstrap, you can unlock your FPS beyond 60, enable Future lighting in all games, and even disable player shadows to boost performance." },
                ru: { h: "FastFlags", p: "FastFlags — это внутренние переключатели движка Roblox. С Foxstrap вы можете разблокировать FPS выше 60, включить освещение Future во всех играх и даже отключить тени для буста производительности." }
            },
            {
                id: 'ui',
                en: { h: "UI & Themes", p: "Our launcher supports Glassmorphism themes. You can change the accent color, adjust blur strength, and choose between Dark and Midnight modes to match your desktop setup." },
                ru: { h: "Интерфейс и Темы", p: "Наш лаунчер поддерживает темы в стиле Glassmorphism. Вы можете менять акцентный цвет, настраивать силу размытия и выбирать между Темным и Полночным режимами под ваш сетап." }
            },
            {
                id: 'rpc',
                en: { h: "Discord RPC", p: "Rich Presence allows you to show detailed info on Discord. Friends will see your game title, server uptime, and a link to join you directly from your profile." },
                ru: { h: "Discord RPC", p: "Rich Presence позволяет показывать подробную инфу в Discord. Друзья увидят название игры, время на сервере и кнопку для прямого захода к вам в профиль." }
            }
        ];

        function openArticle(index) {
            currentIndex = index;
            render();
            document.getElementById('article-viewer').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function navigate(step) {
            currentIndex += step;
            render();
        }

        function render() {
            const body = document.getElementById('article-body');
            const data = content[currentIndex][currentLang];
            
            body.style.animation = 'none';
            body.offsetHeight; // Trigger reflow
            body.style.animation = 'fadeIn 0.4s ease';

            body.innerHTML = `<h2>${data.h}</h2><p>${data.p}</p><pre>Section: ${content[currentIndex].id.toUpperCase()}</pre>`;

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === content.length - 1;
        }

        function closeArticle() {
            document.getElementById('article-viewer').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        document.getElementById('lang-switch').addEventListener('click', function() {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            this.innerText = currentLang === 'en' ? 'RU' : 'EN';
            document.querySelectorAll('[data-en]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + currentLang);
            });
            if (document.getElementById('article-viewer').style.display === 'block') render();
        });

        function createRain() {
            const container = document.getElementById('rain-container');
            setInterval(() => {
                if (container.children.length < 25) {
                    const drop = document.createElement('div');
                    drop.className = 'drop';
                    drop.style.left = Math.random() * 100 + 'vw';
                    const dur = Math.random() * 1 + 1;
                    drop.style.animation = `fall ${dur}s linear forwards`;
                    container.appendChild(drop);
                    setTimeout(() => drop.remove(), dur * 1000);
                }
            }, 200);
        }
        document.addEventListener('DOMContentLoaded', createRain);
    </script>
</body>
</html>
